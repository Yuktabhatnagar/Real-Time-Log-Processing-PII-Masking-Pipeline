# Spring Application Configuration
spring.application.name=kafka-task
server.port=8094
server.servlet.context-path=/kafkaLogs
spring.main.allow-circular-references=true
spring.main.allow-bean-definition-overriding=true
spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER

# Spring Profiles
spring.profiles.active=true

# Kafka Configuration
spring.kafka.bootstrap-servers =localhost:9092
consumer.group-id =log-processor-group
consumer.auto-offset-reset = earliest
consumer.key-deserializer = org.apache.kafka.common.serialization.StringDeserializer
consumer.value-deserializer = org.apache.kafka.common.serialization.StringDeserializer



# PostgreSQL Datasource Configuration
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/decimal
spring.datasource.username=postgres
spring.datasource.password=postgresss
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

